services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      JAVA_OPTS: "-Xms256m -Xmx1024m"

    mem_limit: 2g

    volumes:
      - evap_jenkins_home:/var/jenkins_home

    depends_on:
      - backend

volumes:
  evap_jenkins_home:
