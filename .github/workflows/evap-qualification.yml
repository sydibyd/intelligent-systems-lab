name: EVAP qualification
on:
  push:
    branches: ['feature/evap-industrial-reliability-v1.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evap
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evap_reconciliation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evap -d evap_reconciliation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://evap:ci-only-password@evap-migration-test-db:5432/evap_reconciliation_ci
      EVAP_INTEGRATION_DATABASE_URL: postgresql://evap:ci-only-password@evap-migration-test-db:5432/evap_reconciliation_ci
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        working-directory: projects/embedded-validation-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure isolated database hostname
        run: echo '127.0.0.1 evap-migration-test-db' | sudo tee -a /etc/hosts
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Initialize schema
        working-directory: projects/embedded-validation-platform/backend
        run: python -c 'from main import init; init()'
      - name: Backend qualification
        working-directory: projects/embedded-validation-platform/backend
        run: python -m pytest -q tests/
      - name: HTTP client qualification
        run: python -m pytest -q ci/tests/
