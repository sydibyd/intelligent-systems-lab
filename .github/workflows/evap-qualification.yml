name: EVAP qualification
on:
  push:
    branches: ['feature/evap-industrial-reliability-v1.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evap
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evap_reconciliation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evap -d evap_reconciliation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVAP_AUTH_MODE: development
      DATABASE_URL: postgresql://evap:ci-only-password@evap-migration-test-db:5432/evap_reconciliation_ci
      EVAP_INTEGRATION_DATABASE_URL: postgresql://evap:ci-only-password@evap-migration-test-db:5432/evap_reconciliation_ci
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    defaults:
      run:
        working-directory: projects/embedded-validation-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure isolated database hostname
        run: echo '127.0.0.1 evap-migration-test-db' | sudo tee -a /etc/hosts
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Initialize schema
        working-directory: projects/embedded-validation-platform/backend
        run: python -c 'from main import init; init()'
      - name: Backend qualification
        working-directory: projects/embedded-validation-platform/backend
        run: python -m pytest -q tests/
      - name: HTTP client qualification
        run: python -m pytest -q ci/tests/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend compilation
        working-directory: projects/embedded-validation-platform/frontend
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
          npm run build
      - name: Validate monitoring rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
      - name: Isolated Docker system smoke test
        env:
          EVAP_AUTH_MODE: development
          DB_PASSWORD: ephemeral-ci-password
          COMPOSE_PROJECT_NAME: evap-ci-smoke
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/api/jobs
          curl --fail --silent --show-error http://127.0.0.1:8080/api/ai-drafts
          curl --fail --silent --show-error http://127.0.0.1:8000/api/metrics | grep '^evap_execution_jobs'
          docker compose exec -T sil-worker python -c 'import execution_worker'
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U evap -d evap -c "INSERT INTO requirements(id,description,payload) VALUES ('CI-R1','CI fixture','{}'); INSERT INTO test_cases(id,requirement_id,environment,payload) VALUES ('TC-004','CI-R1','SIL','{}');"
          python ci/queue_smoke.py
      - name: Collect smoke test logs
        if: failure()
        run: docker compose -p evap-ci-smoke logs --tail=100
      - name: Remove isolated smoke test stack
        if: always()
        run: docker compose -p evap-ci-smoke down -v --remove-orphans
